<div class="container-fluid">
  <div class="row">
    <div class="col-12">
      <h3 class="mb-4">Create New Customer (Agent)</h3>

      <div *ngIf="successMessage" class="alert alert-success alert-dismissible">
        {{ successMessage }}
        <button type="button" class="btn-close" (click)="successMessage = ''"></button>
      </div>

      <div *ngIf="errorMessage" class="alert alert-danger alert-dismissible">
        {{ errorMessage }}
        <button type="button" class="btn-close" (click)="errorMessage = ''"></button>
      </div>

      <div class="card shadow">
        <div class="card-header bg-info text-white">
          <h5 class="mb-0">Customer Registration</h5>
        </div>
        <div class="card-body p-4">
          <form (ngSubmit)="createCustomer()">

            <div class="row mb-3">
              <div class="col-md-6">
                <label class="form-label">First Name <span class="text-danger">*</span></label>
                <input type="text" class="form-control" [(ngModel)]="model.firstName" name="firstName"
                  placeholder="Enter first name" required>
              </div>
              <div class="col-md-6">
                <label class="form-label">Last Name <span class="text-danger">*</span></label>
                <input type="text" class="form-control" [(ngModel)]="model.lastName" name="lastName"
                  placeholder="Enter last name" required>
              </div>
            </div>

            <div class="row mb-3">
              <div class="col-md-6">
                <label class="form-label">Email <span class="text-danger">*</span></label>
                <input type="email" class="form-control" [(ngModel)]="model.email" name="email"
                  placeholder="Enter email" required>
              </div>
              <div class="col-md-6">
                <label class="form-label">Mobile Number <span class="text-danger">*</span></label>
                <input type="tel" class="form-control" [(ngModel)]="model.mobileNumber"
                  name="mobileNumber" placeholder="Enter mobile number" required>
              </div>
            </div>

            <div class="mb-3">
              <label class="form-label">Password <span class="text-danger">*</span></label>
              <input type="password" class="form-control" [(ngModel)]="model.password" name="password"
                placeholder="Enter temporary password" required minlength="6">
              <small class="text-muted">Temporary password will be sent to customer via email.</small>
            </div>

            <div class="d-flex gap-2">
              <button type="submit" class="btn btn-info text-white" [disabled]="isLoading">
                <span *ngIf="isLoading" class="spinner-border spinner-border-sm me-2"></span>
                {{ isLoading ? 'Creating...' : 'Create Customer' }}
              </button>
              <button type="button" class="btn btn-secondary" (click)="resetForm()">Reset</button>
            </div>

          </form>
        </div>
      </div>
    </div>
  </div>
</div>
